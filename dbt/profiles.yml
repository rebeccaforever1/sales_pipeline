sales_pipeline:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PG_HOST', 'localhost') }}"
      user: "{{ env_var('PG_USER', 'sales_user') }}"
      password: "{{ env_var('PG_PASSWORD', 'sales_password') }}"
      port: 5432
      dbname: "{{ env_var('PG_DB', 'sales_db') }}"
      schema: analytics
      threads: 4